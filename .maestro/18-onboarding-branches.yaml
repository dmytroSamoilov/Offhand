# Runs last: it clears the app. Covers the onboarding branches the smoke flow
# does not take ("Don't share" and "Not now"), the consent switch in Settings,
# and recording without the microphone permission, which shows the fallback.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp:
    clearState: true
    permissions:
      microphone: deny
- assertVisible: "Never leaves your (phone|iPhone)"
- tapOn: "Don.t share"
- tapOn: "Not now, look around first"
- assertVisible: "No notes yet"

# "Don't share" left the Settings switch off: switched on, then off again
# (its state is not exposed to Maestro)
- tapOn:
    id: "tab_settings"
- scrollUntilVisible:
    element:
      text: "Share anonymous usage"
    centerElement: true
    direction: DOWN
- tapOn: "Share anonymous usage"
- tapOn: "Share anonymous usage"
- tapOn:
    id: "tab_notes"

# Without the microphone the record sheet shows the fallback
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Start a new recording"
      - tapOn:
          text: "(?i)don.t allow|deny"
          optional: true
      - assertVisible: "Tap to record.*"
      - assertVisible: "Start recording"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Record a note"
      - assertVisible: "Offhand needs the microphone"
      - assertVisible: "Open Settings"
