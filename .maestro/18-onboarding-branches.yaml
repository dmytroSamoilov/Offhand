# Runs last: it clears the app. Covers the onboarding branch the smoke flow
# does not take ("Not now"), the consent switch in Settings, and recording
# without the microphone permission, which shows the fallback.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp:
    clearState: true
    permissions:
      microphone: deny
- tapOn: "Not now, look around first"
- assertVisible: "No notes yet"

# Consent is on until it is switched off in Settings (its state is not exposed to Maestro)
- tapOn:
    id: "tab_settings"
- scrollUntilVisible:
    element:
      text: "Share anonymous usage"
    centerElement: true
    direction: DOWN
- tapOn: "Share anonymous usage"
- tapOn:
    id: "tab_notes"

# Without the microphone the record sheet shows the fallback
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Start a new recording"
      - tapOn:
          text: "(?i)don.t allow|deny"
          optional: true
      - assertVisible: "Tap to record.*"
      - assertVisible: "Start recording"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Record a note"
      - assertVisible: "Offhand needs the microphone"
      - assertVisible: "Open Settings"
