# Relies on the notes created by the earlier flows. Android drives the system
# document picker end to end; iOS drives the Files picker by position through
# its search field, the same way the import flow does.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element: "Backup & restore"
          direction: DOWN
      - tapOn: "Backup & restore"
      - tapOn: "Back up"
      - assertVisible: ".*neither you nor we can recover.*"
      - tapOn: "Passphrase"
      - inputText: "smoke-test-passphrase"
      - tapOn: "Repeat passphrase"
      - inputText: "smoke-test-passphrase"
      - hideKeyboard
      - tapOn: "Continue"
      - assertVisible: "Offhand backup.*"
      - tapOn: "Save backup"
      - tapOn:
          text: "(?i)save"
      - extendedWaitUntil:
          visible: "Backup saved"
          timeout: 60000
      - assertVisible: ".*notes and .*folders were saved."
      - tapOn: "Done"
      - tapOn: "Choose a backup file"
      - tapOn:
          text: "Offhand backup.*"
      - assertVisible: "Enter the backup passphrase"
      - inputText: "smoke-test-passphrase"
      - tapOn: "Restore"
      - extendedWaitUntil:
          visible: "Restore complete"
          timeout: 60000
      - assertVisible: ".*skipped as duplicates.*"
      - tapOn: "OK"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Settings"
      - tapOn: "Backup & restore"
      - tapOn: "Back up"
      - assertVisible: ".*neither you nor we can recover.*"
      - tapOn: "Passphrase"
      - inputText: "smoke-test-passphrase"
      - tapOn: "Repeat passphrase"
      - inputText: "smoke-test-passphrase"
      - tapOn: "Continue"
      - assertVisible: "Offhand backup.*"
      - tapOn: "Save backup"
      # The Files export picker is out-of-process, so Maestro cannot read its
      # buttons; "Cancel" is the only label it exposes. Tap the picker's Save
      # button by position instead, which stores the file under On My iPhone.
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 60000
      - tapOn:
          point: "88%,12%"
      - extendedWaitUntil:
          visible: "Backup saved"
          timeout: 30000
      - assertVisible: ".*notes and .*folders were saved."
      - tapOn: "Done"
      # Restore the file just written: the open picker is driven by position
      # through its search like the import flow. The search names today's
      # date so an older backup on the device cannot come first, and a
      # single-file picker opens the tile on tap.
      - tapOn: "Choose a backup file"
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 10000
      - tapOn:
          point: "50%,19%"
      - evalScript: ${output.today = new Date().toISOString().slice(0, 10)}
      - inputText: "Offhand backup ${output.today}"
      # Dismiss the keyboard with its search key first; a tap on the tile while
      # the keyboard is up sometimes only closes the keyboard
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "18%,41%"
      # Files hands the picked file over with a noticeable delay
      - extendedWaitUntil:
          visible: "Enter the backup passphrase"
          timeout: 30000
      - inputText: "smoke-test-passphrase"
      - tapOn: "Restore"
      - extendedWaitUntil:
          visible: "Restore complete"
          timeout: 60000
      - assertVisible: ".*skipped as duplicates.*"
      - tapOn: "OK"
