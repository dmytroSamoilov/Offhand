# Not part of the main folder: it needs a screen lock on the device, which the
# other flows must run without. CI sets one up right before it (Android:
# `adb shell locksettings set-pin 1234`; iOS: Face ID enrolled with notifyutil
# and a loop answering every prompt with pearl.match every few seconds, slow
# enough for the lock screen to be seen first) and removes it after.
# Run with `maestro test .maestro/lock/`. Covers switching the lock on in
# Settings (onboarding no longer asks), the lock screen on the next launch,
# unlocking, and switching the lock off in Settings.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp:
    clearState: true
- tapOn: "Don.t share"
- tapOn: "Not now, look around first"
- tapOn:
    id: "tab_settings"
# iOS confirms the identity with Face ID here (answered by the matcher loop);
# Android asks for the credential only at the lock screen
- scrollUntilVisible:
    element:
      text: "App lock"
    centerElement: true
    direction: DOWN
- tapOn: "App lock"
- waitForAnimationToEnd:
    timeout: 5000
# The Face ID prompt is not in the hierarchy and the matcher answers it up to
# four seconds later, so wait that long for a text that never shows here
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Offhand is locked"
          timeout: 8000
          optional: true

# The next launch is locked
- stopApp
- launchApp
- runFlow:
    when:
      platform: Android
    commands:
      # The credential prompt opens by itself over the lock screen and falls
      # back to the PIN keypad when nothing else is enrolled
      - extendedWaitUntil:
          visible: "Unlock Offhand"
          timeout: 10000
      - inputText: "1234"
      - pressKey: Enter
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Offhand is locked"
          timeout: 10000
- extendedWaitUntil:
    visible: "No notes yet"
    timeout: 15000

# Switching the lock off in Settings makes the next launch open straight away
- tapOn:
    id: "tab_settings"
- scrollUntilVisible:
    element:
      text: "App lock"
    centerElement: true
    direction: DOWN
- tapOn: "App lock"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "No notes yet"
    timeout: 15000
- assertNotVisible: "Offhand is locked"
