# Smoke flow for the uitest flavor / scheme: the AI engines, the model
# download, the device gate and the microphone are canned fakes, so this runs
# on any emulator or simulator. Run with `maestro test .maestro/smoke.yaml`.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Onboarding
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Continue without a lock"
    commands:
      - tapOn: "Continue without a lock"
- runFlow:
    when:
      visible: "Lock Offhand?"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn: "Require unlock to open Offhand"
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Require unlock to open Offhand"
      - tapOn: "Continue"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Share anonymous reports"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Share usage & stability reports"
# Consent is the last page; its Continue ends onboarding
- tapOn: "Continue"
- assertVisible: "Notes"

# Record a note through the fake microphone and engines
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Start a new recording"
      - runFlow:
          when:
            visible: "Start recording"
          commands:
            - tapOn: "Start recording"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Record a note"
- extendedWaitUntil:
    visible: "00:(0[4-9]|[1-5][0-9])"
    timeout: 15000
- tapOn: "Save note"
# The first stop asks for notifications; Maestro may auto-accept the system
# alert before this tap lands.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "^Allow$"
          optional: true

# Saving opens the new note; wait for processing, then go back to the list
- extendedWaitUntil:
    visible: "Summary"
    timeout: 30000
- assertVisible: "Smoke test note"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%,50%"
          end: "70%,50%"
- extendedWaitUntil:
    visible: "Smoke test note"
    timeout: 30000

# Search highlights the matching note
- tapOn: "Search notes"
- inputText: "budget"
- assertVisible: "Smoke test note"
- assertVisible: ".*quarterly budget.*"

# Detail renders both sections (debug builds show a fake in-app review first)
- tapOn: "Smoke test note"
- runFlow:
    when:
      visible: "In-app review · dev build"
    commands:
      - tapOn: "COUNT ATTEMPT"
- assertVisible: "Summary"
- scrollUntilVisible:
    element: "Transcript"
    direction: DOWN
- assertVisible: "Transcript"

# Going back must not hand focus to the search field (regression: keyboard popped up)
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - assertVisible: "Smoke test note"
      - assertNotVisible: "Cancel search"
