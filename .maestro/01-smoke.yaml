# Smoke flow for the uitest flavor / scheme: the AI engines, the model
# download, the device gate and the microphone are canned fakes, so this runs
# on any emulator or simulator. Run with `maestro test .maestro/smoke.yaml`.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp:
    clearState: true
    permissions:
      all: allow

# Onboarding is one screen: its Record pill opens the record sheet
- tapOn: "Record your first note"
- runFlow:
    when:
      visible: "Start recording"
    commands:
      - tapOn: "Start recording"
- extendedWaitUntil:
    visible: "00:(0[4-9]|[1-5][0-9])"
    timeout: 15000
- tapOn: "Save note"
# The first stop asks for notifications; Maestro may auto-accept the system
# alert before this tap lands.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "^Allow$"
          optional: true

# Saving opens the new note on its Transcript tab; the Summary tab is marked
# when the summary is written and is only opened by a tap. A note that was
# already finished when it opened is on its Summary tab with nothing to mark.
- extendedWaitUntil:
    visible: "Summary is ready|Copy summary"
    timeout: 30000
- tapOn: "Summary"
- assertVisible: "Copy summary"
- assertVisible: "Smoke test note"
# Back to the list
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%,50%"
          end: "70%,50%"
- extendedWaitUntil:
    visible: "Smoke test note"
    timeout: 30000

# Search highlights the matching note
- tapOn: "Search notes"
- inputText: "budget"
- assertVisible: "Smoke test note"
- assertVisible: ".*quarterly budget.*"

# A finished note opens on its Summary tab and the Transcript is one tap away
# (debug builds show a fake in-app review first)
- tapOn: "Smoke test note"
- runFlow:
    when:
      visible: "In-app review · dev build"
    commands:
      - tapOn: "COUNT ATTEMPT"
- assertVisible: "Copy summary"
- assertNotVisible: "Summary is ready"
- tapOn: "Transcript"
- assertVisible: "Copy transcript"
- assertVisible: ".*quarterly budget.*"

# Going back must not hand focus to the search field (regression: keyboard popped up)
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - assertVisible: "Smoke test note"
      - assertNotVisible: "Cancel search"
