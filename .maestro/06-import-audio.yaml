# Runs after 01-smoke.yaml. Expects an audio file named import-sample.* in the
# device's Download folder (Android) or in the simulator's "On My iPhone"
# storage (iOS; CI copies it into the LocalStorage file provider) and covers
# importing it from Settings through the system file picker into a new note.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp
- assertVisible: "Smoke test note"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element:
            text: "Import audio or video"
          direction: DOWN
      - tapOn: "Import audio or video"
      # Downloads also holds the files the other flows save there
      - tapOn:
          text: "Audio"
          optional: true
      - scrollUntilVisible:
          element:
            text: "import-sample.m4a"
          direction: DOWN
      - tapOn:
          text: "import-sample.m4a"
      - extendedWaitUntil:
          visible: "Import started"
          timeout: 10000
      - assertVisible: "1 file is being imported.*"
      - tapOn: "OK"
      - tapOn:
          id: "tab_notes"
      # The fake engines finish the import within seconds, so the placeholder
      # named after the file may already be gone; wait for the second note
      - extendedWaitUntil:
          visible:
            text: "Smoke test note"
            index: 1
          timeout: 90000
      - assertNotVisible: "import-sample"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Settings"
      # On a tall screen the row first lands under the floating tab bar
      - scrollUntilVisible:
          element: "Import audio or video"
          centerElement: true
      - tapOn: "Import audio or video"
      # The document picker runs out of process and is invisible to Maestro,
      # and it reopens in whatever folder it showed last, so it is driven by
      # position through its search: search field, name, the keyboard's
      # search key (which closes the keyboard), the first result tile, then Open
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "50%,19%"
      - inputText: "import-sample"
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "18%,37%"
      - tapOn:
          point: "87%,13%"
      - extendedWaitUntil:
          visible: "Import started"
          timeout: 10000
      - assertVisible: "1 file is being imported.*"
      - tapOn: "OK"
      - tapOn:
          id: "tab_notes"
      - extendedWaitUntil:
          visible:
            text: "Smoke test note"
            index: 1
          timeout: 90000
      - assertNotVisible: "import-sample"
