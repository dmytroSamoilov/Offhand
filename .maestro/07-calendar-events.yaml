# Runs after 01-smoke.yaml. The fake model answers the calendar prompt with two
# canned events right after the note is structured; the flow checks the Smart
# suggestions section, dismisses one card, hands the other to the system
# calendar editor, and checks that both states survive a relaunch.
appId: com.dmytrosamoilov.offhand.uitest
---
- launchApp
- assertVisible: "Smoke test note"
- tapOn: "Smoke test note"
- runFlow:
    when:
      visible: "In-app review · dev build"
    commands:
      - tapOn: "COUNT ATTEMPT"
- extendedWaitUntil:
    visible: "Smart suggestions"
    timeout: 30000
# Centre the cards so their buttons sit clear of the floating tab bar
- scrollUntilVisible:
    element:
      text: "Dismiss suggestion"
    direction: DOWN
    centerElement: true
- assertVisible: "Budget review with Anna"
- assertVisible: "Send quarterly report"
# Dismiss the first card; the all-day one slides into its place
- tapOn:
    text: "Dismiss suggestion"
    index: 0
- assertNotVisible: "Budget review with Anna"
- assertVisible: ".*All day"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Add to calendar"
      # The calendar app's insert screen takes over; its first-run screens vary,
      # so relaunching Offhand is the only reliable way back
      - extendedWaitUntil:
          notVisible: "Add to calendar"
          timeout: 15000
      - launchApp
      - assertVisible: "Smoke test note"
      - tapOn: "Smoke test note"
      - runFlow:
          when:
            visible: "In-app review · dev build"
          commands:
            - tapOn: "COUNT ATTEMPT"
      - scrollUntilVisible:
          element:
            text: "Send quarterly report"
          direction: DOWN
          centerElement: true
      - assertVisible: "Added"
      - assertNotVisible: "Budget review with Anna"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Add to calendar"
      - extendedWaitUntil:
          visible: "New Event"
          timeout: 15000
      - assertVisible: "Send quarterly report"
      # The editor's close button sits top-left and is not labelled for Maestro
      - tapOn:
          point: "9%,12%"
      # The "Discard Changes" popover is not exposed to accessibility either
      - extendedWaitUntil:
          notVisible: "New Event"
          timeout: 5000
      - tapOn:
          point: "32%,24%"
      - extendedWaitUntil:
          visible: "Add to calendar"
          timeout: 5000
      - launchApp
      - tapOn: "Smoke test note"
      - runFlow:
          when:
            visible: "In-app review · dev build"
          commands:
            - tapOn: "COUNT ATTEMPT"
      - assertVisible: "Send quarterly report"
      - assertNotVisible: "Budget review with Anna"
