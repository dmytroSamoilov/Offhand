name: Offhand
options:
  bundleIdPrefix: com.dmytrosamoilov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.16.0
targets:
  Offhand:
    type: application
    platform: iOS
    sources:
      - Offhand
      - Shared
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - framework: Frameworks/sherpa-onnx.xcframework
        embed: false
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
      - framework: ../shared-framework/build/XCFrameworks/release/OffhandShared.xcframework
        embed: false
      - target: OffhandWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmytrosamoilov.offhand
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-lc++"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S5UT57PQ2J
        ENABLE_USER_SCRIPT_SANDBOXING: false
    entitlements:
      path: Offhand/Offhand.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Offhand/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.dmytrosamoilov.offhand.finish.*
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Offhand records your voice notes. Audio never leaves this device."
        ITSAppUsesNonExemptEncryption: false
  OffhandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmytrosamoilov.offhand.widgets
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S5UT57PQ2J
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Offhand Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
