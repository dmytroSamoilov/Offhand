name: Offhand
options:
  bundleIdPrefix: com.dmytrosamoilov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug-dev: debug
  Release-dev: release
  Debug-prod: debug
  Release-prod: release
settings:
  configs:
    # DEV_UNLOCK is deliberately confined to this one configuration: the dev
    # flavor built for debug. No release build and no prod build compiles it.
    Debug-dev:
      APP_ID_SUFFIX: .dev
      APP_DISPLAY_NAME: Offhand Dev
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEV_UNLOCK
    Release-dev:
      APP_ID_SUFFIX: .dev
      APP_DISPLAY_NAME: Offhand Dev
    Debug-prod: &prod
      APP_ID_SUFFIX: ""
      APP_DISPLAY_NAME: Offhand
    Release-prod: *prod
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.16.0
targets:
  Offhand:
    type: application
    platform: iOS
    sources:
      - Offhand
      - Shared
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - framework: Frameworks/sherpa-onnx.xcframework
        embed: false
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
      - framework: ../shared-framework/build/XCFrameworks/release/OffhandShared.xcframework
        embed: false
      - target: OffhandWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmytrosamoilov.offhand$(APP_ID_SUFFIX)
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-lc++"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S5UT57PQ2J
        ENABLE_USER_SCRIPT_SANDBOXING: false
    entitlements:
      path: Offhand/Offhand.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: Offhand/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).finish.*
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Offhand records your voice notes. Audio never leaves this device."
        ITSAppUsesNonExemptEncryption: false
  OffhandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmytrosamoilov.offhand$(APP_ID_SUFFIX).widgets
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S5UT57PQ2J
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME) Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Offhand-dev:
    build:
      targets:
        Offhand: all
    run:
      config: Debug-dev
    test:
      config: Debug-dev
    profile:
      config: Release-dev
    analyze:
      config: Debug-dev
    archive:
      config: Release-dev
  Offhand-prod:
    build:
      targets:
        Offhand: all
    run:
      config: Debug-prod
    test:
      config: Debug-prod
    profile:
      config: Release-prod
    analyze:
      config: Debug-prod
    archive:
      config: Release-prod
