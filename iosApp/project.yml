name: Offhand
options:
  bundleIdPrefix: com.dmytrosamoilov
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.16.0
targets:
  Offhand:
    type: application
    platform: iOS
    sources:
      - Offhand
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - framework: Frameworks/sherpa-onnx.xcframework
        embed: false
      - framework: Frameworks/onnxruntime.xcframework
        embed: false
      - framework: ../shared-framework/build/bin/iosSimulatorArm64/debugFramework/OffhandShared.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmytrosamoilov.offhand
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "-lc++"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/../shared-framework/build/bin/iosSimulatorArm64/debugFramework"
        ENABLE_USER_SCRIPT_SANDBOXING: false
    info:
      path: Offhand/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Offhand records your voice notes. Audio never leaves this device."
        ITSAppUsesNonExemptEncryption: false
